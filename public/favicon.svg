<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="s" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6b35"/>
      <stop offset="35%" stop-color="#f7467a"/>
      <stop offset="70%" stop-color="#c850c0"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="50%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a9f"/>
    </linearGradient>
    <clipPath id="c">
      <circle cx="16" cy="16" r="15"/>
    </clipPath>
  </defs>

  <!-- Dark circular background -->
  <circle cx="16" cy="16" r="16" fill="#0a0a0a"/>
  <circle cx="16" cy="16" r="15" fill="#111111"/>

  <g clip-path="url(#c)">
    <!-- Primary organic blob — simplified for small size -->
    <path d="M 5 32 Q 8 24, 12 21 Q 15 18, 13 14 Q 11 9, 15 6 Q 20 3, 22 8 Q 24 13, 27 16 Q 30 20, 28 26 Q 26 32, 30 32 Z"
          fill="url(#s)" opacity="0.9"/>

    <!-- Secondary accent blob -->
    <path d="M 2 22 Q 6 18, 10 20 Q 13 22, 11 16 Q 9 10, 13 9 Q 8 8, 4 12 Q 1 17, 2 22 Z"
          fill="url(#w)" opacity="0.55"/>

    <!-- Small warm orb -->
    <circle cx="22" cy="8" r="2.5" fill="#ffb347" opacity="0.5"/>

    <!-- Subtle sound-wave arc -->
    <path d="M 6 16 Q 11 11, 16 16 Q 21 21, 26 16"
          fill="none" stroke="#ffffff" stroke-width="0.8" stroke-linecap="round" opacity="0.2"/>
  </g>

  <!-- Border ring -->
  <circle cx="16" cy="16" r="14.5" fill="none" stroke="url(#s)" stroke-width="1" opacity="0.5"/>
</svg>
