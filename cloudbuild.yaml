
steps:
  # Build and push image for nest-legacy.
  - name: "gcr.io/cloud-builders/docker"
    id: "Build"
    args:
      - "build"
      - "-t"
      - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "Push"
    args:
      - "push"
      - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}"

  # Deploy only image + service identity; keep existing service auth/secrets/network config.
  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}"
      - "--region"
      - "${_AR_REGION}"
      - "--platform"
      - "managed"
      - "--quiet"

images:
  - "${_AR_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO_NAME}/${_SERVICE_NAME}:${_IMAGE_TAG}"

substitutions:
  _AR_REGION: "us-central1"
  _AR_REPO_NAME: "nest-legacy"
  _SERVICE_NAME: "nest-legacy"
  _IMAGE_TAG: "latest"
